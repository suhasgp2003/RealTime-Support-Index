<!doctype html>
<html>
<body data-conversation-id="{{ conversation_id }}" data-csrf="{{ csrf_token }}">
  <h1>Conversation {{ conversation_id }}</h1>
  <ul id="log"></ul>
  <input id="box" placeholder="Type a message">
  <button id="send">Send</button>

  <script>
  const id = Number(document.body.dataset.conversationId);
  const csrf = document.body.dataset.csrf;
  const log = document.getElementById("log");
  const show = (m) => {
    const li = document.createElement("li");
    li.textContent = `${m.sender_type}: ${m.body}`;
    log.appendChild(li);
  };

  const proto = location.protocol === "https:" ? "wss" : "ws";
  const socket = new WebSocket(`${proto}://${location.host}/ws/conversations/${id}/`);
  socket.onmessage = (e) => show(JSON.parse(e.data));

  fetch(`/api/conversations/${id}/messages/`).then(r => r.json()).then(list => list.forEach(show));

  document.getElementById("send").onclick = async () => {
    const box = document.getElementById("box");
    await fetch(`/api/conversations/${id}/messages/`, {
     method: "POST",
     headers: {"Content-Type": "application/json", "X-CSRFToken": csrf},
     body: JSON.stringify({body: box.value}),
    });
    box.value = "";
  };
  </script>
</body>
</html>
